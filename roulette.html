document.addEventListener('click',e=>{if(!e.target.closest('.reward-picker,.reward-choice-wrap'))closeRewardMenus();});

async function spinTo(plan,roundIndex){const canvas=$('wheel'),n=plan.names.length,step=360/n,target=-(plan.winnerIndex+.5)*step;drawWheel(plan.names);$('roundLine').textContent=`${roundIndex+1} / ${state.items.length} ROUND`;const label=$('roundItem');label.replaceChildren();if(rewardImage(plan.item)){const icon=document.createElement('img');icon.src=plan.item.icon;icon.alt='추첨 보상 아이콘';icon.style.cssText='display:block;width:64px;height:64px;object-fit:contain;margin:0 auto';label.append(icon);}else{label.textContent=plan.item.text;}$('runStatus').textContent=`${plan.names.length}명 중 추첨 중…`;$('progressBar').style.width=((roundIndex)/state.items.length*100)+'%';canvas.style.transition='none';canvas.style.transform=`rotate(${state.rotation}deg)`;canvas.getBoundingClientRect();const current=((state.rotation%360)+360)%360,targetNorm=((target%360)+360)%360;let delta=(targetNorm-current+360)%360;delta+=360*(5+secureIndex(3));state.rotation+=delta;canvas.style.transition='transform 3.65s cubic-bezier(.08,.72,.10,1)';canvas.style.transform=`rotate(${state.rotation}deg)`;await sleep(3700);$('runStatus').textContent=roundIndex===state.items.length-1?'마지막 회차 완료 · 결과 정리 중…':'회차 완료 · 다음 룰렛으로 이동합니다…';$('progressBar').style.width=((roundIndex+1)/state.items.length*100)+'%';await sleep(roundIndex===state.items.length-1?850:720);}
