<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#000"><title>Cat Hero Guild Platform V4.0</title><style>html,body{margin:0;width:100%;height:100%;background:#000;font-family:"Pretendard Variable",-apple-system,BlinkMacSystemFont,sans-serif}.view{position:fixed;inset:0;width:100%;height:100%;border:0;background:#000}.boot{position:fixed;inset:0;display:grid;place-items:center;background:#000;color:#d9c6ff;font-weight:900}.landing{min-height:100%;box-sizing:border-box;background:radial-gradient(circle at 50% -10%,#35185f,#07050c 42%,#000 100%);color:#fff;padding:24px 16px}.panel{max-width:520px;margin:8vh auto 0;border:1px solid #4e3374;border-radius:20px;background:#120d1b;padding:18px;box-shadow:0 20px 60px #0008}.panel h1{font-size:23px;margin:0 0 5px}.panel p{color:#bfaed6;font-size:13px;line-height:1.5}.input,.btn{box-sizing:border-box;width:100%;height:44px;border-radius:11px;font:inherit}.input{border:1px solid #65448f;background:#09070d;color:#fff;padding:0 12px}.btn{border:0;background:linear-gradient(#8959e5,#6233bd);color:#fff;font-weight:900;margin-top:8px}.ghost{background:#21162f;border:1px solid #62428a}.status{margin-top:9px;color:#d8c9e8;font-size:12px;line-height:1.5}.platform-list{display:grid;gap:8px;margin-top:14px}.guild-card{border:1px solid #3f2e56;border-radius:12px;padding:10px;background:#0d0913}.guild-card b{display:block}.row{display:flex;gap:6px}.row .btn{height:36px;font-size:12px}.meta{font-size:11px;color:#a996bf;margin-top:4px;word-break:break-all}</style><link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css"></head><body><div id="root"><div class="boot">V4 길드 공간 확인 중…</div></div><script src="firebase-config.js"></script><script type="module">
import {initializeApp,getApps,getApp} from 'https://www.gstatic.com/firebasejs/12.3.0/firebase-app.js';import {getAuth,onAuthStateChanged,signInWithEmailAndPassword,createUserWithEmailAndPassword,signOut} from 'https://www.gstatic.com/firebasejs/12.3.0/firebase-auth.js';import {getFirestore,doc,getDoc,setDoc,updateDoc,collection,getDocs,onSnapshot,writeBatch,runTransaction,serverTimestamp} from 'https://www.gstatic.com/firebasejs/12.3.0/firebase-firestore.js';
const CFG=window.GUILD_OPS_CONFIG,app=getApps().length?getApp():initializeApp(CFG.firebase),auth=getAuth(app),db=getFirestore(app),root=document.getElementById('root');
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const rand=(n=10)=>{const chars='ABCDEFGHJKLMNPQRSTUVWXYZ23456789',a=new Uint32Array(n);crypto.getRandomValues(a);return Array.from(a,x=>chars[x%chars.length]).join('')};const q=new URLSearchParams(location.search),gid=(q.get('g')||'').toUpperCase();
window.CAT_HERO_V4_CONTEXT=null;window.CAT_HERO_V4_AUTH_STATE={guildId:gid,isGuildAdmin:false,isPlatformAdmin:false,user:null};
async function roleFor(id){if(typeof auth.authStateReady==='function')await auth.authStateReady();const u=auth.currentUser;window.CAT_HERO_V4_AUTH_STATE.user=u?{uid:u.uid,email:u.email}:null;window.CAT_HERO_V4_AUTH_STATE.isPlatformAdmin=!!u&&u.uid===CFG.platformAdminUid;window.CAT_HERO_V4_AUTH_STATE.isGuildAdmin=false;if(u&&id){try{const s=await getDoc(doc(db,'guilds',id,'admins',u.uid));window.CAT_HERO_V4_AUTH_STATE.isGuildAdmin=s.exists()&&s.data().active===true;}catch(_e){}}return window.CAT_HERO_V4_AUTH_STATE;}
async function ensureGuildAdmin(id){await roleFor(id);if(window.CAT_HERO_V4_AUTH_STATE.isGuildAdmin)return true;let u=auth.currentUser;if(!u){const mode=confirm('확인을 누르면 관리자 로그인, 취소를 누르면 최초 관리자 계정 등록을 진행합니다.');const email=(prompt('관리자 이메일')||'').trim();if(!email)return false;const pw=prompt('관리자 비밀번호');if(!pw)return false;try{if(mode)u=(await signInWithEmailAndPassword(auth,email,pw)).user;else u=(await createUserWithEmailAndPassword(auth,email,pw)).user;}catch(e){alert('인증 실패: '+(e.code||e.message));return false;}}await roleFor(id);if(window.CAT_HERO_V4_AUTH_STATE.isGuildAdmin){return true;}const code=(prompt('이 길드의 1회성 관리자 등록코드를 입력하세요.')||'').trim().toUpperCase();if(!code)return false;try{await runTransaction(db,async tx=>{const ir=doc(db,'guildInvites',code),ar=doc(db,'guilds',id,'admins',u.uid),is=await tx.get(ir),as=await tx.get(ar);if(!is.exists())throw Error('등록코드를 찾을 수 없습니다.');const d=is.data();if(d.guildId!==id||d.used!==false||Number(d.expiresAtMs)<=Date.now())throw Error('사용할 수 없는 등록코드입니다.');if(as.exists())throw Error('이미 관리자 등록이 되어 있습니다.');tx.set(ar,{role:'admin',active:true,inviteId:code,createdAt:serverTimestamp()});tx.update(ir,{used:true,usedAt:serverTimestamp()});});await roleFor(id);if(window.CAT_HERO_V4_AUTH_STATE.isGuildAdmin){alert('길드 관리자 등록이 완료되었습니다.');return true;}return false;}catch(e){alert('관리자 등록 실패: '+(e.code||e.message));return false;}}
window.CAT_HERO_V4_ENSURE_ADMIN=ensureGuildAdmin;
let frame=null;function route(){const h=(location.hash||'').slice(1);return ['main','boss','ops'].includes(h)?h:'main'}
function showRoute(r,push=false){if(!frame)return;if(!['main','boss','ops'].includes(r))r='main';frame.src=`${r}.html?g=${encodeURIComponent(gid)}`;if(push)history.pushState({r},'',`${location.pathname}?g=${encodeURIComponent(gid)}${r==='main'?'':'#'+r}`);}
window.addEventListener('message',e=>{const d=e.data||{};if(d.type==='dosalja-unified-route'&&['main','boss','ops'].includes(d.route))showRoute(d.route,true);});window.addEventListener('popstate',()=>showRoute(route(),false));
async function loadGuild(){try{const gs=await getDoc(doc(db,'guilds',gid));if(!gs.exists())return landing('존재하지 않는 길드 주소입니다.');const guild={id:gid,...gs.data()};if(guild.active===false)return landing('현재 비활성화된 길드입니다.');const rs=await getDoc(doc(db,'guilds',gid,'data','roster')),rd=rs.exists()?rs.data():{};const ctx={guildId:gid,guild,members:rd.members||{},aliases:rd.aliases||{},formerNames:{}};window.CAT_HERO_V4_CONTEXT=ctx;localStorage.setItem(`cat-hero-v4:${gid}:context`,JSON.stringify(ctx));await roleFor(gid);root.innerHTML='';frame=document.createElement('iframe');frame.className='view';frame.title='Cat Hero Guild';root.append(frame);showRoute(route(),false);onSnapshot(doc(db,'guilds',gid,'data','roster'),s=>{const d=s.exists()?s.data():{};ctx.members=d.members||{};ctx.aliases=d.aliases||{};ctx.guild.memberCount=Object.keys(ctx.members).length;localStorage.setItem(`cat-hero-v4:${gid}:context`,JSON.stringify(ctx));},()=>{});}catch(e){landing('길드 정보를 불러오지 못했습니다. '+(e.code||e.message));}}
function landing(msg=''){root.innerHTML=`<main class="landing"><section class="panel"><h1>Cat Hero Guild Platform</h1><p>길드마다 별도의 무작위 주소를 사용합니다. 일반 길드원은 전달받은 주소로 조회하고, 데이터 입력·수정은 해당 길드 관리자만 가능합니다.</p><form id="join"><input class="input" name="code" maxlength="20" placeholder="길드 코드"><button class="btn" type="submit">길드 열기</button></form><button class="btn ghost" id="platform">중앙관리자</button><div class="status">${esc(msg)}</div><div id="platformHost"></div></section></main>`;document.getElementById('join').onsubmit=e=>{e.preventDefault();const id=e.currentTarget.code.value.trim().toUpperCase();if(!/^[A-Z0-9]{8,20}$/.test(id))return;location.href=`${location.pathname}?g=${encodeURIComponent(id)}`};document.getElementById('platform').onclick=openPlatform;}
async function platformLogin(){await roleFor('');if(window.CAT_HERO_V4_AUTH_STATE.isPlatformAdmin)return true;const email=(prompt('중앙관리자 이메일')||'').trim();if(!email)return false;const pw=prompt('비밀번호');if(!pw)return false;try{await signInWithEmailAndPassword(auth,email,pw);await roleFor('');if(!window.CAT_HERO_V4_AUTH_STATE.isPlatformAdmin){alert('중앙관리자 계정이 아닙니다.');return false;}return true;}catch(e){alert('로그인 실패: '+(e.code||e.message));return false;}}
async function openPlatform(){if(!await platformLogin())return;const host=document.getElementById('platformHost');host.innerHTML=`<hr style="border-color:#352544;margin:18px 0"><h2 style="font-size:17px">새 길드 생성</h2><form id="create"><input class="input" name="server" placeholder="서버번호" required><input class="input" style="margin-top:6px" name="name" placeholder="길드명" required><button class="btn">길드 생성 + 최초 관리자 코드</button></form><div id="createResult" class="status"></div><div id="guildList" class="platform-list"></div>`;document.getElementById('create').onsubmit=async e=>{e.preventDefault();const id=rand(16),invite=rand(20),b=writeBatch(db);b.set(doc(db,'guilds',id),{name:e.currentTarget.name.value.trim(),server:e.currentTarget.server.value.trim(),active:true,memberCount:0,appVersion:CFG.version,createdAt:serverTimestamp(),updatedAt:serverTimestamp()});b.set(doc(db,'guildInvites',invite),{guildId:id,used:false,createdAt:serverTimestamp(),expiresAtMs:Date.now()+7*86400000-300000,issuerRole:'platform'});b.set(doc(db,'guilds',id,'data','roster'),{members:{},aliases:{},updatedAt:serverTimestamp()});b.set(doc(db,'guilds',id,'data','rewards'),{records:[],updatedAt:serverTimestamp()});await b.commit();document.getElementById('createResult').innerHTML=`생성 완료<br>길드 주소: ${esc(new URL(`${location.pathname}?g=${id}`,location.origin).href)}<br>최초 관리자 등록코드: <b>${invite}</b>`;loadGuildList();};loadGuildList();}
async function loadGuildList(){const host=document.getElementById('guildList');if(!host)return;const s=await getDocs(collection(db,'guilds')),arr=s.docs.map(d=>({id:d.id,...d.data()}));host.innerHTML=arr.map(g=>`<div class="guild-card"><b>${esc(g.server||'-')} · ${esc(g.name||'길드')}</b><div class="meta">${g.id} · ${g.active===false?'비활성':'활성'}</div><div class="row"><button class="btn ghost" data-url="${g.id}">주소</button><button class="btn ghost" data-invite="${g.id}">등록코드</button><button class="btn ghost" data-toggle="${g.id}" data-active="${g.active===false?'0':'1'}">${g.active===false?'활성화':'비활성화'}</button></div></div>`).join('');host.querySelectorAll('[data-url]').forEach(b=>b.onclick=()=>prompt('길드 전용 주소',new URL(`${location.pathname}?g=${b.dataset.url}`,location.origin).href));host.querySelectorAll('[data-invite]').forEach(b=>b.onclick=async()=>{const code=rand(20);await setDoc(doc(db,'guildInvites',code),{guildId:b.dataset.invite,used:false,createdAt:serverTimestamp(),expiresAtMs:Date.now()+7*86400000-300000,issuerRole:'platform'});alert('1회성 관리자 등록코드\n'+code);});host.querySelectorAll('[data-toggle]').forEach(b=>b.onclick=async()=>{await updateDoc(doc(db,'guilds',b.dataset.toggle),{active:b.dataset.active!=='1',updatedAt:serverTimestamp()});loadGuildList();});}
onAuthStateChanged(auth,()=>{if(gid)roleFor(gid);});if(gid&&/^[A-Z0-9]{8,20}$/.test(gid))loadGuild();else landing();
</script></body></html>
